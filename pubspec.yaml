name: bomberos_app
description: "Sistema de alertas del Cuerpo de Bomberos de Cotacachi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_messaging: ^16.1.1
  googleapis_auth: ^2.0.0 # OAuth2 para enviar push por FCM HTTP v1

  # Ubicación y mapas
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Utilidades
  intl: ^0.20.2
  url_launcher: ^6.3.0
  file_picker: ^11.0.2
  http: ^1.6.0 # Subida de archivos a Cloudinary
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Genera los iconos de launcher con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    # Credencial de FCM (NO se sube a git, ver assets/credenciales/LEEME.md)
    - assets/credenciales/
